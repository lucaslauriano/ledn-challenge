services:
  nats:
    image: nats:2.10-alpine
    container_name: ledn-nats
    ports:
      - '4222:4222'
      - '8222:8222'
    command: ['--jetstream', '--http_port', '8222']

  redis:
    image: redis:7-alpine
    container_name: ledn-redis
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes

volumes:
  redis-data:
